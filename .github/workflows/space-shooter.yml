name: Update Space Shooter contribution graph

on:
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/space-shooter.yml"]

permissions:
  contents: read

concurrency:
  group: space-shooter-contribution-graph
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out reviewed generator source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: czl9707/gh-space-shooter
          ref: 96d45ed9a790300da731b9fc49b95d697f528464 # v2, MIT
          path: generator
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install reviewed Space Shooter generator
        run: python -m pip install ./generator
      - name: Generate Space Shooter GIF
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh-space-shooter shinju4n --output dist/space-shooter.gif --strategy random --fps 40
      - name: Validate animated GIF
        shell: python
        run: |
          from PIL import Image
          with Image.open("dist/space-shooter.gif") as image:
              assert image.format == "GIF" and image.is_animated
              assert image.n_frames > 1
              print(f"Validated {image.size}, {image.n_frames} frames")
      - name: Save generated GIF
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: space-shooter-gif
          path: dist/space-shooter.gif
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download generated GIF
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: space-shooter-gif
          path: dist
      - name: Publish GIF without rewriting branch history
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: python
        run: |
          import base64
          import json
          import os
          from pathlib import Path
          import urllib.error
          import urllib.request

          branch = "space-shooter-output"
          base = "https://api.github.com/repos/" + os.environ["REPOSITORY"]
          headers = {
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }

          def api(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(base + path, data=data, headers=headers, method=method)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          name = "space-shooter.gif"
          data = Path("dist", name).read_bytes()
          if not 0 < len(data) < 50_000_000 or data[:6] not in (b"GIF87a", b"GIF89a"):
              raise ValueError("Invalid or oversized Space Shooter GIF")
          files = {name: data}

          try:
              parent = api("GET", "/git/ref/heads/" + branch)["object"]["sha"]
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              parent = None

          tree_request = {"tree": []}
          if parent:
              tree_request["base_tree"] = api("GET", "/git/commits/" + parent)["tree"]["sha"]
          for name, data in files.items():
              blob = api("POST", "/git/blobs", {
                  "content": base64.b64encode(data).decode(),
                  "encoding": "base64",
              })
              tree_request["tree"].append({
                  "path": name, "mode": "100644", "type": "blob", "sha": blob["sha"],
              })
          tree = api("POST", "/git/trees", tree_request)
          if parent and tree["sha"] == tree_request["base_tree"]:
              print("GIF is unchanged.")
          else:
              commit = api("POST", "/git/commits", {
                  "message": "Update Space Shooter contribution graph",
                  "tree": tree["sha"],
                  "parents": [parent] if parent else [],
              })
              if parent:
                  api("PATCH", "/git/refs/heads/" + branch, {"sha": commit["sha"], "force": False})
              else:
                  api("POST", "/git/refs", {"ref": "refs/heads/" + branch, "sha": commit["sha"]})
              print("Published to " + branch + " at " + commit["sha"])
