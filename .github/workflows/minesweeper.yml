name: Update Minesweeper contribution graph

on:
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/minesweeper.yml"]

permissions:
  contents: read

concurrency:
  group: minesweeper-contribution-graph
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Upstream reports the public username and game statistics to
      # elec.abozanona.me. No personal access token is required.
      - name: Generate light and dark Minesweeper SVGs
        uses: abozanona/pacman-contribution-graph@294c47eff28a41339a279107ae771b5fa020037a
        with:
          github_user_name: shinju4n
          github_token: ${{ github.token }}
          games: minesweeper
      - name: Save generated SVGs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: minesweeper-svgs
          path: |
            dist/minesweeper-contribution-graph.svg
            dist/minesweeper-contribution-graph-dark.svg
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download generated SVGs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: minesweeper-svgs
          path: dist
      - name: Publish SVGs without rewriting branch history
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: python
        run: |
          import base64
          import json
          import os
          from pathlib import Path
          import urllib.error
          import urllib.request
          import xml.etree.ElementTree as ET

          branch = "minesweeper-output"
          base = "https://api.github.com/repos/" + os.environ["REPOSITORY"]
          headers = {
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }

          def api(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(base + path, data=data, headers=headers, method=method)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          files = {}
          for name in ("minesweeper-contribution-graph.svg", "minesweeper-contribution-graph-dark.svg"):
              data = Path("dist", name).read_bytes()
              if not 0 < len(data) < 20_000_000:
                  raise ValueError("Unexpected SVG size: " + name)
              root = ET.fromstring(data)
              if root.tag != "{http://www.w3.org/2000/svg}svg":
                  raise ValueError("Invalid SVG root: " + name)
              for element in root.iter():
                  tag = element.tag.rsplit("}", 1)[-1].lower()
                  if tag in ("script", "foreignobject"):
                      raise ValueError("Active SVG content: " + name)
                  for key, value in element.attrib.items():
                      attribute = key.rsplit("}", 1)[-1].lower()
                      if attribute.startswith("on") or (attribute == "href" and not value.startswith("#")):
                          raise ValueError("Unsafe SVG attribute: " + name)
              files[name] = data

          try:
              parent = api("GET", "/git/ref/heads/" + branch)["object"]["sha"]
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              parent = None

          tree_request = {"tree": []}
          if parent:
              tree_request["base_tree"] = api("GET", "/git/commits/" + parent)["tree"]["sha"]
          for name, data in files.items():
              blob = api("POST", "/git/blobs", {
                  "content": base64.b64encode(data).decode(),
                  "encoding": "base64",
              })
              tree_request["tree"].append({
                  "path": name, "mode": "100644", "type": "blob", "sha": blob["sha"],
              })
          tree = api("POST", "/git/trees", tree_request)
          if parent and tree["sha"] == tree_request["base_tree"]:
              print("SVGs are unchanged.")
          else:
              commit = api("POST", "/git/commits", {
                  "message": "Update Minesweeper contribution graph",
                  "tree": tree["sha"],
                  "parents": [parent] if parent else [],
              })
              if parent:
                  api("PATCH", "/git/refs/heads/" + branch, {"sha": commit["sha"], "force": False})
              else:
                  api("POST", "/git/refs", {"ref": "refs/heads/" + branch, "sha": commit["sha"]})
              print("Published to " + branch + " at " + commit["sha"])
